version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kardashev
      POSTGRES_PASSWORD: kardashev
      POSTGRES_DB: energy
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      # Host port 5435, not 5432 -- a native Postgres.app instance already
      # owns 5432 on dev machines and its more-specific localhost bind wins
      # over this container's 0.0.0.0:5432 forward, silently routing
      # connections to the wrong Postgres (discovered 2026-07-17). 5433/5434
      # are also taken by other local containers (regdb-postgres,
      # interconnection-queue-tracker-postgres-1).
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kardashev -d energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kardashev:kardashev@db:5432/energy
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
    ports:
      - "8000:8000"

  ingest:
    build: .
    command: python -m ingest.scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kardashev:kardashev@db:5432/energy
      PJM_API_KEY: ${PJM_API_KEY:-}

volumes:
  timescale_data:
