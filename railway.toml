[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# BUILD only — per-service overrides live in the Railway dashboard:
#   api:    Dockerfile + start = python /app/run.py, healthcheck = /health
#   ingest: Dockerfile.ingest + start = python /app/start_ingest.py (no healthcheck)
# Both share DATABASE_URL from the Railway Postgres addon.
# Ingest needs LibreOffice (monthly ERCOT LLWG PPTX); api uses the slim Dockerfile.

[deploy]
# healthcheckPath is intentionally omitted here (ingest is a daemon, no HTTP).
# Set healthcheckPath = "/health" on the api service in Railway dashboard.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
