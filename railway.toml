[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# ---------------------------------------------------------------------------
# This file configures the BUILD. Railway services are configured separately
# in the Railway dashboard. Create two services from this repo:
#
#   Service 1 — "api"
#     Start command: python /app/run.py        (migrates schema, then uvicorn)
#     Health check:  GET /health               (verifies DB connectivity)
#
#   Service 2 — "ingest"
#     Start command: python /app/start_ingest.py   (migrates schema, then schedules)
#     Health check:  (none — long-running daemon)
#
# Both services share the same Dockerfile.
# Both get DATABASE_URL injected from the Railway Postgres addon.
# ---------------------------------------------------------------------------

[deploy]
# No healthcheckPath here — ingest is a daemon with no HTTP server.
# Set healthcheckPath = "/health" only on the "api" service in Railway dashboard.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
