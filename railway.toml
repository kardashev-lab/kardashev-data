[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# This file configures the BUILD only. Services are configured in the Railway dashboard.
# Create two services from this repo:
#
#   api:    start command = python /app/run.py          health check = GET /health
#   ingest: start command = python /app/start_ingest.py health check = none (daemon)
#
# Both share the same Dockerfile and get DATABASE_URL from the Railway Postgres addon.

[deploy]
# healthcheckPath is intentionally omitted here (ingest is a daemon, no HTTP).
# Set healthcheckPath = "/health" on the api service in Railway dashboard.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
