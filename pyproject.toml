[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kardashev-data"
version = "0.1.0"
description = "US energy grid data platform: fuel mix, carbon intensity, LMP, curtailment, and more."
requires-python = ">=3.11"

dependencies = [
    "kardashev>=0.3.1",
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pytz>=2024",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<0.130",
    "starlette>=0.41.0,<1.0.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "shapely>=2.0",
]
ingest = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["iso_data*", "api*", "ingest*", "db*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # long lines in SQL strings and data tables
]

[tool.pytest.ini_options]
testpaths = ["tests"]
