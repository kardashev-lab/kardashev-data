name: Curtailment backfill

on:
  workflow_dispatch:
    inputs:
      iso:
        description: "ISO to backfill (CAISO, SPP, ERCOT, or ALL)"
        required: false
        default: ALL
      days:
        description: "Number of recent days to backfill"
        required: false
        default: "3"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install ".[ingest]"

      - name: Run backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m ingest.scheduler backfill "${{ github.event.inputs.iso || 'ALL' }}" "${{ github.event.inputs.days || '3' }}"
